      #primer .pmovetext { margin-top: 4px; font-size: 15px; line-height: 1.4; font-style: italic; }
      #primer .pmove.coach { font-size: 15px; line-height: 1.4; }
      #primer .pwatch { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--muted); }
      #primer .pwatch .pdot { flex: none; width: 10px; height: 10px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--muted); }
      #primer .pwatch.on .pdot { background: var(--live); border-color: var(--live); }
      #primer .pqueue li .pfine { display: block; margin-top: 2px; }
      #primer .pclock { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      #primer .pmockprob { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: var(--chip); }
      #primer .pmockprob.now { outline: 2px solid var(--accent); }
      #primer .pscorecell { font-weight: 650; font-variant-numeric: tabular-nums; }
      #primer .pmarks ul { list-style: none; padding: 0; margin: 6px 0; }
      #primer .pmark { padding: 6px 8px; margin: 4px 0; border-left: 3px solid #d03030; border-radius: 0 8px 8px 0; cursor: pointer; }
      #primer .pmark.open { background: color-mix(in srgb, #d03030 8%, transparent); }
      #primer .pmarkhead { color: #d03030; font-size: 13px; font-weight: 600; }
      #primer .psure { display: flex; gap: 10px; align-items: center; margin: 10px 0 2px; }
      #primer .psure input { flex: 1; }
      #primer .pgoals { display: grid; grid-template-columns: 1fr 7em; gap: 6px; margin: 6px 0; }
      #primer .pgoals input, #primer .pgoals select { min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--chip); background: transparent; color: inherit; font: inherit; }
      #primer .pgoals input:first-child { grid-column: 1 / -1; }
      #primer .pfeatures { list-style: none; padding: 0; margin: 4px 0; font-size: 14px; }
      #primer .pfeatures li { margin: 4px 0; }
      #primer .plink { align-self: center; color: var(--accent); }
      #primer .psteps { list-style: none; margin: 8px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      #primer .pstep { padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; outline: none; }
      #primer .pstep:hover, #primer .pstep:focus-visible { background: var(--chip); }
      #primer .pstep.marked { box-shadow: 0 0 0 2px rgba(255,196,0,0.85); background: color-mix(in srgb, #ffc400 10%, transparent); }
      #primer .pstep.gap { border-color: color-mix(in srgb, #d99a00 55%, transparent); }
      #primer .pstep.error { border-color: color-mix(in srgb, var(--off) 60%, transparent); }
      #primer .pstephead { display: flex; align-items: center; gap: 8px; }
      #primer .pnum { font-weight: 650; }
      #primer .pstatus { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; background: var(--chip); color: var(--muted); }
      #primer .pstatus.ok { color: var(--live); }
      #primer .pstatus.gap { color: #b07800; background: color-mix(in srgb, #ffc400 18%, transparent); }
      #primer .pstatus.error { color: #fff; background: var(--off); }
      #primer .pconf { color: var(--muted); font-size: 11px; }
      #primer .ptext { font-size: 13px; }
      #primer .pjust { font-size: 13px; color: var(--muted); }
      #primer .pnote { margin-top: 4px; font-size: 13px; font-weight: 550; }
      #primer .pstep.error .pnote { color: var(--off); }
      #primer .plabel { margin: 12px 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
      #primer .pfindings ul, #primer .pbody > ul { margin: 0; padding-left: 18px; font-size: 13px; }
      #primer .pcheck { margin: 10px 0; font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; }
      #primer .pcheck.checked { color: var(--live); }
      #primer .pcheck.failed { color: var(--off); }
      #primer .pactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      #primer button.go, #primer .pactions button, #primer .pforget button { font: inherit; font-weight: 600; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; background: var(--chip); color: var(--fg); }
      #primer .pactions button.go { background: var(--chip-on); color: var(--chip-on-fg); }
      #primer .pactions button:disabled { opacity: 0.45; cursor: default; }
      #primer .pforget { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
      #primer .pforget p { margin: 0 0 8px; font-size: 13px; }
      #primer .pforget button.danger { background: var(--off); color: #fff; margin-right: 6px; }
      #primer .pforget button.danger-link { background: transparent; color: var(--off); padding: 4px 0; }
      #primer .pnotice { margin-top: 10px; color: var(--muted); font-size: 12px; }
      #primer .pexam { font-weight: 650; margin-bottom: 8px; }
      #primer .pweeks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      #primer .pweek { padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; }
      #primer .pweek.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
      #primer .pweekhead { display: flex; align-items: center; gap: 8px; }
      #primer .pqueue li { margin: 4px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #primer .pwho { display: flex; align-items: center; gap: 10px; }
      #primer .pwho .plabel { margin: 0; }
      #primer .pwho input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); }
      #primer .pbody > ul.pbars, #primer .pbody > ul.pqueue { list-style: none; padding: 0; margin: 0; }
      #primer .pbars li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 36px; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; }
      #primer .pbar { height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; }
      #primer .pfill { display: block; height: 100%; background: var(--accent); }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c3-1 4-4 6-8s4-7 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="18" cy="4" r="2" fill="currentColor"/></svg>codrawer</span>
      <span id="conn"><span>connecting</span></span>
      <button id="replayChip" type="button" title="Leave the replay and show the live page" hidden><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Replay · Live</button>
      <span class="spacer"></span>
      <span class="seg" role="group" aria-label="View">
        <button type="button" data-view="follow" aria-pressed="false" title="Follow the pen at the glasses' scale">Follow</button>
        <button type="button" data-view="focus" aria-pressed="false" title="Fit the writing">Fit</button>
        <button type="button" data-view="page" aria-pressed="false" title="The whole page">Page</button>
      </span>
      <button id="drawBtn" class="icon" type="button" aria-pressed="false" aria-label="Draw" title="Draw here (shared with everyone in the session)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
      <button id="camBtn" class="icon" type="button" aria-pressed="false" aria-label="Camera" title="Draw over the camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button id="freezeBtn" class="icon" type="button" aria-pressed="false" aria-label="Freeze frame" title="Freeze the camera frame" hidden><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      <button id="themeBtn" class="icon" type="button" aria-label="Theme" title="Paper or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button id="debugBtn" class="icon" type="button" aria-pressed="false" aria-label="Glasses" title="Diagnostics: glasses previews and metrics"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4M3 14l1.5-6M21 14l-1.5-6"/></svg></button>
      <button id="recDot" type="button" aria-label="Recording session" title="Recording session" hidden></button>
      <button id="menuBtn" class="icon" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Menu" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </div>
    <div id="menu" role="menu" aria-label="codrawer" hidden>
      <button class="item" type="button" role="menuitem" data-act="new"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>New drawing…</button>
      <div class="confirm" id="confirmNew" hidden><p>Clear the page for everyone?</p><button type="button" class="danger" data-act="new-yes">Clear</button> <button type="button" data-act="new-no">Cancel</button></div>
      <button class="item" type="button" role="menuitem" data-act="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo my last stroke</button>
      <button class="item" type="button" role="menuitem" data-act="clear-mine"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M14 4l6 6-8 8H8l-4-4z"/></svg>Clear my strokes<span class="note"></span></button>
      <hr />
      <div class="label" id="colorLabel">My colour</div>
      <div class="swatches" role="group" aria-labelledby="colorLabel"></div>
      <hr />
      <div class="label" id="typerLabel">Reply typing speed</div>
      <div role="group" aria-labelledby="typerLabel">
        <button class="item" type="button" role="menuitemradio" aria-checked="false" data-act="typer" data-speed="careful">Careful<span class="note"></span></button>
        <button class="item" type="button" role="menuitemradio" aria-checked="false" data-act="typer" data-speed="fast">Fast<span class="note"></span></button>
        <button class="item" type="button" role="menuitemradio" aria-checked="false" data-act="typer" data-speed="instant">Instant<span class="note"></span></button>
      </div>
      <hr />
      <button class="item" type="button" role="menuitem" data-act="png"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download page as PNG</button>
      <button class="item" type="button" role="menuitem" data-act="invite"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Copy invite link</span></button>
      <button class="item" type="button" role="menuitem" data-act="address"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 17h6"/></svg>Tablet address…</button>
      <button class="item" type="button" role="menuitem" data-act="tl"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z"/></svg><span>Export timelapse…</span></button>
      <div class="confirm" id="tlBox" hidden>
        <div class="tl-opts">
          <div class="row"><span>Length</span><span class="seg" role="group" aria-label="Length"><button type="button" data-len="10">10 s</button><button type="button" data-len="20">20 s</button><button type="button" data-len="40">40 s</button></span></div>
          <div class="row"><span>Theme</span><span class="seg" role="group" aria-label="Theme"><button type="button" data-tltheme="paper">Paper</button><button type="button" data-tltheme="dark">Dark</button></span></div>
          <button type="button" class="go" data-act="tl-go">Record</button> <button type="button" data-act="tl-no">Cancel</button>
        </div>
        <div class="tl-run" hidden><progress id="tlProgress" max="1" value="0"></progress><button type="button" data-act="tl-cancel">Cancel</button></div>
        <div class="tl-done" hidden><button type="button" class="go" data-act="tl-share">Share video</button> <button type="button" data-act="tl-discard">Discard</button></div>
      </div>
      <button class="item" type="button" role="menuitem" data-act="replay"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Replay this page</button>
      <button class="item" type="button" role="menuitem" data-act="marks"><svg viewBox="0 0 24 24"><path d="M13 3l-6 9h5l-2 9 7-11h-5z"/></svg>My marks<span class="note"></span></button>
      <button class="item" type="button" role="menuitem" data-act="replay-file"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M10 11v6l5-3z"/></svg>Replay a recording…</button>
      <hr />
      <button class="item" type="button" role="menuitemcheckbox" aria-checked="false" data-act="rec"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg><span>Record session</span></button>
      <button class="item" type="button" role="menuitem" data-act="rec-export"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export recording (.jsonl)<span class="note"></span></button>
      <hr />
      <button class="item" type="button" role="menuitemcheckbox" aria-checked="false" data-act="primer"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M8 11h3M8 15h6"/><path d="M13 8.5l1.5 1.5 3-3"/></svg>Proof panel</button>
      <hr />
      <button class="item" type="button" role="menuitemcheckbox" aria-checked="false" data-act="wide"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="1.5"/><path d="M12 7v10"/></svg>Glasses: wide fit view</button>
      <button class="item" type="button" role="menuitemcheckbox" aria-checked="false" data-act="diag"><svg viewBox="0 0 24 24"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4"/></svg>Diagnostics</button>
      <button class="item" type="button" role="menuitemcheckbox" aria-checked="false" data-act="dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Dark theme</button>
    </div>
    <div id="banner" hidden><span id="bannerText"></span><button id="bannerOk" type="button">OK</button></div>
    <canvas id="stage"></canvas>
    <div id="replay" role="region" aria-label="Replay" hidden>
      <div class="rp-top"><span class="rp-caption" id="rpCaption" aria-live="polite"></span><span class="rp-time" id="rpTime"></span></div>
      <div id="rpTrack" role="slider" tabindex="0" aria-label="Replay position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rp-rail"></div><div class="rp-fill"></div><div class="rp-range" hidden></div><div class="rp-marks"></div><div class="rp-head"></div></div>
      <div class="rp-ctrl">
        <button type="button" class="icon" data-rp="prev" aria-label="Previous stroke" title="Previous stroke (left arrow)"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 5l-9 7 9 7z"/></svg></button>
        <button type="button" class="icon" data-rp="play" aria-label="Play" title="Play (space)"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>
        <button type="button" class="icon" data-rp="next" aria-label="Next stroke" title="Next stroke (right arrow)"><svg viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 5l9 7-9 7z"/></svg></button>
        <span class="seg" role="group" aria-label="Speed"><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button><button type="button" data-speed="8">8×</button></span>
        <button type="button" class="chipbtn" data-rp="compress" aria-pressed="true" title="Shorten long pauses on the timeline (the pen keeps its own speed)">Compress pauses</button>
        <button type="button" class="chipbtn" data-rp="clip" aria-pressed="false" title="Export part of the replay as a video">Clip</button>
        <span class="spacer"></span>
        <button type="button" class="go" data-rp="live" title="Back to the live page (Esc)">Live</button>
      </div>
      <div class="rp-clip" hidden>
        <button type="button" class="chipbtn" data-rp="in" title="The clip starts at the playhead">Start here</button>
        <button type="button" class="chipbtn" data-rp="out" title="The clip ends at the playhead">End here</button>
        <span class="rp-clip-len"></span>
        <span class="spacer"></span>
        <progress max="1" value="0" hidden></progress>
        <button type="button" class="go" data-rp="clip-go">Export clip</button>
      </div>
      <div class="rp-legend" aria-hidden="true"><span style="--k: var(--pause)">Pause</span><span style="--k: var(--erase)">Erase</span><span style="--k: var(--rewrite)">Rewrite</span><span style="--k: var(--hesitation)">Hesitation</span><span style="--k: var(--burst)">Burst</span><span style="--k: var(--contribution)">Others</span></div>
    </div>
    <div id="marks" role="dialog" aria-label="My marks" hidden>
      <div class="mk-head"><b>My marks</b><span class="spacer"></span><button class="icon" type="button" data-mk="close" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="mk-body"></div>
    </div>
    <div id="markAsk" role="region" aria-label="What does this mark mean?" aria-live="polite" hidden></div>
    <div id="markChips" aria-live="polite"></div>
    <input id="replayFile" type="file" accept=".jsonl,.ndjson,application/x-ndjson,application/json,text/plain" hidden />
    <aside id="primer" aria-label="Proof panel" hidden>
      <div class="ptop">
        <div class="ptabs" role="tablist"><button type="button" role="tab" data-tab="proof" aria-selected="true">Proof</button><button type="button" role="tab" data-tab="plan" aria-selected="false">Plan</button><button type="button" role="tab" data-tab="coach" aria-selected="false" title="Practice coach">Coach</button><button type="button" role="tab" data-tab="mock" aria-selected="false" title="Putnam mock exam">Mock</button><button type="button" role="tab" data-tab="learner" aria-selected="false">Learner</button></div>
        <button class="icon pclose" type="button" aria-label="Close the Proof panel" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="pbody"></div>
    </aside>
    <video id="camera" playsinline muted autoplay hidden></video>
    <div id="debug">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <canvas id="preview" width="288" height="144"></canvas>
        <canvas id="loupe" width="192" height="144"></canvas>
      </div>
      <div id="status">starting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

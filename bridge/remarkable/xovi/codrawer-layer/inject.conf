# Injections the codrawer-layer extension makes into xochitl's live UI (src/inject.h).
# One per line, the arguments of the `inject` command:
#   name=<n> parent=<match>[^] qml=<file> [after=1] [when=selection] [inside=<match>] [inert=1]
# <match> is class:<substring> | name:<objectName> | text:<text> | prop:<name>=<value>; a trailing
# ^ takes the matched item's parent, and after=1 stacks ours right after the matched item.
# Re-read when it changes; a match that finds nothing creates nothing and says so in the log.

# The dock: right after the redo button in the left toolbar (3.29.0.149: toolbarLayout is a
# GridLayout of 112 x 112 ToolLoaders; found with `tree match=name:toolbarLayout depth=1`).
name=dock parent=name:editingToolLoader_redoButton^ qml=/home/root/xovi/exthome/codrawer-layer/dock.qml after=1

# "Ask" in the selection menu: after its delete button, in the menu's ButtonRow (3.29.0.149:
# SelectionContextualMenu "selectionHandlerMenu" > ButtonRow > four 80 x 80 Buttons; found with
# `tree match=class:SelectionContextualMenu depth=4`). Only inside that menu (other menus have the
# same icon; an empty lasso once put Ask into one of them). Made right after a lasso; its taps are sent
# with source "selection".
name=selection parent=prop:iconSource=qrc:/ark/icons/trashcan^ qml=/home/root/xovi/exthome/codrawer-layer/selection-ask.qml after=1 when=selection inside=name:selectionHandlerMenu

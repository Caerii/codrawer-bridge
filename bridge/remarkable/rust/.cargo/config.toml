# Cross-build for the Paper Pro from any host with only rustup: musl ships its own CRT objects and
# libc in the Rust target, and rust-lld (bundled with rustc) links them into a static binary.
#   rustup target add aarch64-unknown-linux-musl
#   cargo build --release --target aarch64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# x86_64 Linux, for exercising the Linux-only code (evdev reader, cfg(linux) tests) in a container.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
